<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="forestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d37"/>
      <stop offset="100%" stop-color="#102e21"/>
    </linearGradient>
    <linearGradient id="blushPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf0ed"/>
      <stop offset="100%" stop-color="#e8a8a2"/>
    </linearGradient>
    <linearGradient id="rosePetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7d4d0"/>
      <stop offset="100%" stop-color="#cb7871"/>
    </linearGradient>
    <radialGradient id="goldCenter" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="55%" stop-color="#f3cb88"/>
      <stop offset="100%" stop-color="#c98a42"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#forestBg)" stroke="#e9ccc7" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Centered Flower -->
  <g transform="translate(64, 64)" filter="url(#softShadow)">
    <!-- Outer 8 Petals -->
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#rosePetal)" transform="rotate(0)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#blushPetal)" transform="rotate(45)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#rosePetal)" transform="rotate(90)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#blushPetal)" transform="rotate(135)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#rosePetal)" transform="rotate(180)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#blushPetal)" transform="rotate(225)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#rosePetal)" transform="rotate(270)"/>
    <path d="M 0,-10 C -15,-20 -15,-46 0,-50 C 15,-46 15,-20 0,-10 Z" fill="url(#blushPetal)" transform="rotate(315)"/>

    <!-- Inner Blossom Layer -->
    <circle cx="0" cy="-14" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="10" cy="-10" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="14" cy="0" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="10" cy="10" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="0" cy="14" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="-10" cy="10" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="-14" cy="0" r="8" fill="#fdedeb" opacity="0.85"/>
    <circle cx="-10" cy="-10" r="8" fill="#fdedeb" opacity="0.85"/>

    <!-- Golden Pistil Core -->
    <circle cx="0" cy="0" r="14" fill="url(#goldCenter)"/>
    <circle cx="0" cy="0" r="7" fill="#b06c27" opacity="0.45"/>
    <circle cx="-3" cy="-3" r="2.5" fill="#fff" opacity="0.6"/>
  </g>
</svg>
